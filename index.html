<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Routine</title>

<!-- PWA / iOS home screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Routine">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23000'/%3E%3Ccircle cx='90' cy='90' r='52' fill='none' stroke='%23fff' stroke-width='8'/%3E%3Cline x1='90' y1='90' x2='90' y2='52' stroke='%23fff' stroke-width='8' stroke-linecap='round'/%3E%3Cline x1='90' y1='90' x2='116' y2='104' stroke='%23fff' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23000'/%3E%3Ccircle cx='90' cy='90' r='52' fill='none' stroke='%23fff' stroke-width='8'/%3E%3Cline x1='90' y1='90' x2='90' y2='52' stroke='%23fff' stroke-width='8' stroke-linecap='round'/%3E%3Cline x1='90' y1='90' x2='116' y2='104' stroke='%23fff' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">

<style>
:root{
  --black:#000; --white:#fff;
  --g95:#f2f2f2; --g90:#e6e6e6; --g60:#999; --g40:#666; --g20:#333;
  --pad:20px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;position:fixed;overflow:hidden;top:0;left:0;background:#fff}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  background:var(--white); color:var(--black);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;
}
input,textarea{user-select:text;-webkit-user-select:text}
input:focus,textarea:focus,select:focus{
  outline:2px solid var(--black);outline-offset:0;border-color:var(--black)
}
button:focus{outline:none}
button:focus-visible{outline:2px solid var(--black);outline-offset:2px}
button{font:inherit;background:none;border:none;color:inherit;cursor:pointer}

/* ---------- layout ---------- */
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;height:100vh;height:100dvh}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px var(--pad) 32px}
header.page h1{font-size:32px;font-weight:800;letter-spacing:-0.03em;margin-bottom:22px}

/* tab bar: floating white pill */
nav{
  display:flex;flex:none;background:var(--white);border:1px solid var(--g90);border-radius:999px;
  margin:6px 14px calc(var(--safe-bottom) + 8px);padding:6px;
  box-shadow:0 6px 22px rgba(0,0,0,.10)
}
nav button{
  flex:1;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:9px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;
  color:var(--g60);border-radius:999px;transition:background .15s ease,color .15s ease
}
nav button.active{color:var(--black);background:var(--g95)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* generic list cards */
.card{
  border:1px solid var(--black);border-radius:14px;padding:17px 16px;margin-bottom:12px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--white)
}
.card .info{flex:1;min-width:0}
.card h3{font-size:17px;font-weight:700;letter-spacing:-0.01em;word-break:break-word;line-height:1.25}
.chev{color:var(--g60);flex:none;display:flex;align-items:center}

.empty{
  border:1px dashed var(--g90);border-radius:14px;padding:36px 20px;text-align:center;
  color:var(--g60);font-size:14px;line-height:1.5
}

/* buttons */
.btn{
  display:block;width:100%;padding:15px;border-radius:12px;text-align:center;
  font-size:15px;font-weight:700;letter-spacing:0.01em;
}
.btn.solid{background:var(--black);color:var(--white)}
.btn.line{border:1px solid var(--black)}
.btn.ghost{color:var(--g40);font-weight:600}
.btn.tracked{
  background:var(--g95);color:var(--black);
  display:flex;align-items:center;justify-content:center;gap:8px
}
.btn.tracked svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.btn+.btn{margin-top:10px}
.iconbtn{padding:8px;color:var(--g40)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}

.fab{
  position:fixed;right:20px;bottom:calc(88px + var(--safe-bottom));
  width:56px;height:56px;border-radius:50%;background:var(--black);color:var(--white);
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:5
}
.fab svg{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}

/* section labels */
.eyebrow{font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--g60);margin:22px 0 10px}

/* ---------- habits ---------- */
.habit{border:1px solid var(--black);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.habit .row{display:flex;align-items:center;gap:12px}
.habit .check{
  width:28px;height:28px;border:1.5px solid var(--black);border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center
}
.habit .check.done{background:var(--black)}
.habit .check svg{width:14px;height:14px;stroke:var(--white);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.habit .name{flex:1;font-size:16px;font-weight:700}
.habit .streak{font-size:12px;color:var(--g60);font-variant-numeric:tabular-nums}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.grid7 .cell{
  aspect-ratio:1;border-radius:5px;background:var(--g90);position:relative;
  display:flex;align-items:center;justify-content:center
}
.grid7 .cell .cd{font-size:11px;font-weight:600;color:var(--g60);font-variant-numeric:tabular-nums}
.grid7 .cell.on{background:var(--black)}
.grid7 .cell.on .cd{color:var(--white)}
.grid7 .cell.today .cd{color:var(--black);font-weight:800}
.grid7 .cell.blank{background:transparent}
.monthlbl{font-size:12px;font-weight:700;letter-spacing:0.04em;color:var(--g40);margin:14px 0 2px;text-align:center}
.daylabels{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0 4px}
.daylabels span{font-size:9px;text-align:center;color:var(--g60);text-transform:uppercase;letter-spacing:0.05em}

/* ---------- weekly plan ---------- */
.goalline{font-size:13px;font-weight:600;color:var(--g40);padding-bottom:12px}
.trow{border-top:1px solid var(--g90);padding:11px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.tlabel{font-size:13px;color:var(--g60);font-weight:600}
.tval{font-size:13px;font-weight:700;text-align:right}
.dayrow .dayname{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--g60);margin-bottom:3px}
.dayrow .dayroutine{font-size:12px;color:var(--g60);margin-top:3px}
.card.todayrow{border-width:2px;padding:16px 15px}
.dayplay{color:var(--black)}
.dayplay svg{width:22px;height:22px}

/* ---------- library ---------- */
.cat{border:1px solid var(--black);border-radius:16px;padding:14px 16px 2px;margin-bottom:14px;background:var(--white)}
.cat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cat-head h2{font-size:18px;font-weight:800;letter-spacing:-0.01em}
.catbtns{display:flex;flex:none}
.ex{border-top:1px solid var(--g90);padding:11px 0;display:flex;align-items:center;gap:10px}
.ex .info{flex:1;min-width:0}
.ex h4{font-size:15px;font-weight:700}
.ex .desc{font-size:12px;color:var(--g40);margin-top:2px;line-height:1.4}
.dosestat{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;min-width:46px}
.dosestat .dnum{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.dosestat .dunit{font-size:9px;font-weight:700;letter-spacing:0.06em;margin-right:-0.06em;text-transform:uppercase;color:var(--g60);margin-top:3px}
.addex{
  display:block;width:100%;text-align:center;padding:12px 0;
  border-top:1px solid var(--g90);font-size:13px;font-weight:700;color:var(--g40)
}

/* ---------- routine editor ---------- */
.topbar{display:flex;align-items:center;gap:6px;margin-bottom:18px}
.topbar .back{padding:8px 8px 8px 0}
.topbar .back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.topbar h1{font-size:22px;font-weight:800;letter-spacing:-0.02em;flex:1;min-width:0;word-break:break-word}
.step{
  border:1px solid var(--black);border-radius:12px;padding:12px 14px;margin-bottom:10px;
  display:flex;align-items:center;gap:10px;background:var(--white)
}
.step .info{flex:1;min-width:0}
.step h4{font-size:15px;font-weight:700}
.step .meta{font-size:13px;font-weight:600;color:var(--g60);font-variant-numeric:tabular-nums;white-space:nowrap}
.step .notes{font-size:12px;color:var(--g40);margin-top:3px;line-height:1.4}
.ordbtns{display:flex;flex-direction:column;gap:2px}
.ordbtns button{padding:2px 6px;color:var(--g40)}
.ordbtns svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.total{font-size:13px;color:var(--g60);margin:4px 0 16px}

/* ---------- runner (Routinery style) ---------- */
#runner{
  position:fixed;inset:0;background:var(--white);color:var(--black);z-index:50;
  display:none;flex-direction:column;
  padding:calc(var(--safe-top) + 14px) 24px calc(var(--safe-bottom) + 28px)
}
#runner.open{display:flex}
#runner .r-top{display:flex;align-items:center;justify-content:space-between}
#runner .r-count{
  font-size:13px;font-weight:700;color:var(--g40);font-variant-numeric:tabular-nums;
  letter-spacing:0.05em;background:var(--g95);padding:8px 16px;border-radius:99px
}
#runner .r-exit{color:var(--g40);background:var(--g95);border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center}
#runner .r-exit svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
#runner .r-mid{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;min-height:0}
#runner .r-spacer{flex:1}
#runner .r-nextwrap{flex:1;display:flex;align-items:center;justify-content:center}
#runner .r-step{font-size:30px;font-weight:800;letter-spacing:-0.03em;line-height:1.15;word-break:break-word;max-width:100%;margin-bottom:16px}
#runner .r-time.over{color:var(--g40)}
#runner .r-circle{position:relative;width:min(72vw,300px);aspect-ratio:1}
#runner .r-circle svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#runner .r-circle .track{fill:var(--g95);stroke:none}
#runner .r-circle .prog{fill:none;stroke:var(--black);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
#runner .r-circle .inner{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px
}
#runner .r-time{
  font-size:min(16vw,66px);font-weight:250;letter-spacing:-0.03em;line-height:1;
  font-variant-numeric:tabular-nums
}
#runner .r-reps{display:flex;flex-direction:column;align-items:center;justify-content:center}
#runner .r-reps .num{font-size:min(15vw,60px);font-weight:250;letter-spacing:-0.02em;line-height:1}
#runner .r-reps .lbl{font-size:17px;color:var(--g60);margin-top:3px}
#runner .r-notes{font-size:14px;color:var(--g60);line-height:1.5;max-width:300px}
#runner .r-next{font-size:13px;color:var(--g60)}
#runner .r-bar{height:3px;background:var(--g95);border-radius:2px;overflow:hidden;margin:20px 0 26px}
#runner .r-bar i{display:block;height:100%;background:var(--black);width:0%;transition:width .3s linear}
#runner .r-ctrl{display:flex;align-items:center;justify-content:center;gap:44px}
#runner .r-ctrl .small{color:var(--g60)}
#runner .r-ctrl .small svg{width:30px;height:30px}
#runner .r-ctrl .big{
  width:82px;height:82px;border-radius:50%;background:var(--black);color:var(--white);
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.18)
}
#runner .r-ctrl .big svg{width:32px;height:32px}
#runner .r-ctrl svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#runner .r-done-btn{
  border:1.5px solid var(--black);border-radius:14px;padding:16px 44px;font-size:16px;font-weight:700;margin-top:8px
}

/* ---------- animations ---------- */
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#main.viewin{animation:viewIn .18s ease-out}
@keyframes runnerIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
#runner.open{animation:runnerIn .22s ease-out}
@keyframes stepIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
#runner .r-mid.stepin{animation:stepIn .25s ease-out}
.btn,.fab,.card,#runner .r-ctrl .big,#runner .r-ctrl .small,.habit .check{transition:transform .12s ease}
.btn:active,.card:active{transform:scale(.98)}
.fab:active,#runner .r-ctrl .big:active,.habit .check:active{transform:scale(.9)}
#runner .r-ctrl .small:active{transform:scale(.85)}

@keyframes fieldIn{from{opacity:0}to{opacity:1}}
#f-valwrap.fieldswap>*{animation:fieldIn .22s ease-out}

/* ---------- sheets / modals ---------- */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none}
#overlay.open{display:block}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--white);
  border-radius:20px 20px 0 0;padding:18px var(--pad) calc(var(--safe-bottom) + 18px);
  transform:translateY(105%);transition:transform .25s ease;max-height:92dvh;overflow-y:auto
}
#sheet.open{transform:translateY(0)}
#sheet h2{font-size:19px;font-weight:800;margin-bottom:16px;letter-spacing:-0.01em}
.field{margin-bottom:18px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--g60);margin-bottom:6px}
.field input[type=text],.field input[type=number],.field textarea,.field select{
  width:100%;padding:12px 14px;border:1px solid var(--black);border-radius:10px;font-size:16px;background:var(--white);color:var(--black);appearance:none
}
.field textarea{resize:none;height:64px}
.seg{display:flex;border:1px solid var(--black);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:11px;font-size:14px;font-weight:700}
.seg button.on{background:var(--black);color:var(--white)}
/* looping scroll wheel time picker */
.wheelwrap{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;height:120px;overflow:hidden}
.wheel{height:120px;width:70px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.wheel::-webkit-scrollbar{display:none}
.wheel .pad{height:40px}
.wheel .it{
  height:40px;display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:300;scroll-snap-align:center;color:var(--g60);
  font-variant-numeric:tabular-nums
}
.wheel .it.on{color:var(--black);font-weight:700}
.wheellbl{font-size:13px;color:var(--g60);font-weight:700;min-width:20px;text-transform:uppercase}
.wheel-center{
  position:absolute;left:0;right:0;top:40px;height:40px;
  border-top:1px solid var(--g90);border-bottom:1px solid var(--g90);pointer-events:none
}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.sheet-actions{margin-top:16px}
.danger{color:var(--black);text-decoration:underline;text-underline-offset:3px;font-size:13px;font-weight:600;display:block;margin:16px auto 0}

@media (min-width:700px){
  main{max-width:520px;margin:0 auto;width:100%}
  nav{justify-content:center}
  nav button{max-width:170px}
}
</style>
</head>
<body>
<div id="app">
  <main id="main"></main>
  <button id="fab" class="fab" style="display:none"></button>
  <nav id="nav">
    <button data-tab="routines">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      Routines
    </button>
    <button data-tab="habits">
      <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M8.5 13.5l2.5 2.5 4.5-5"/></svg>
      Habits
    </button>
    <button data-tab="plan">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
      Plan
    </button>
    <button data-tab="library">
      <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/></svg>
      Library
    </button>
  </nav>
</div>

<div id="overlay"></div>
<div id="sheet"></div>

<div id="runner">
  <div class="r-top">
    <span class="r-count" id="r-count"></span>
    <button class="r-exit" onclick="Runner.exit()"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="r-mid" id="r-mid"></div>
  <div class="r-bar"><i id="r-bar"></i></div>
  <div class="r-ctrl" id="r-ctrl"></div>
</div>

<script>
/* =========================================================
   Storage
========================================================= */
const KEY = 'bw_tracker_v1';
const uid = () => Math.random().toString(36).slice(2,10);

function libraryDefaults(){
  const t = (name,desc,secs)=>({id:uid(),name,desc,mode:'time',value:secs});
  const r = (name,desc,reps)=>({id:uid(),name,desc,mode:'reps',value:reps});
  return [
    { id:uid(), name:'Posture', exercises:[
      r('Chin tucks','Draw chin straight back, hold 2s, keep eyes level.',12),
      r('Wall angels','Back flat on wall, slide arms up and down slowly.',10),
      t('Thoracic extensions','Arch upper back over a chair edge or foam roller.',45),
      r('Shoulder blade squeezes','Pinch shoulder blades together, hold 3s.',15)
    ]},
    { id:uid(), name:'Flat feet', exercises:[
      r('Arch lifts','Raise arch while keeping toes and heel on the floor.',15),
      r('Toe curls','Grip the floor or a towel with your toes.',20),
      r('Calf raises','Rise slowly onto toes, lower with control.',15),
      t('Towel scrunches','Scrunch a towel toward you with your toes.',60),
      t('Short foot exercise','Shorten the foot by pulling the ball toward the heel.',45)
    ]},
    { id:uid(), name:'Football plyometrics', exercises:[
      r('Box jumps','Explosive jump onto a box, step down softly.',8),
      r('Lateral bounds','Push off one leg sideways, stick the landing.',10),
      r('Single leg hops','Small quick hops on one leg, then switch.',12),
      r('Depth jumps','Step off a box, land and jump up immediately.',6),
      r('Sprint starts','Explode into a 10 m sprint from standing.',5)
    ]},
    { id:uid(), name:'Football warmup', exercises:[
      t('Light jog','Easy pace to raise heart rate and warm muscles.',180),
      t('High knees','Drive knees up to hip height, quick rhythm.',30),
      t('Butt kicks','Heels to glutes, stay light on your feet.',30),
      r('Walking lunges with twist','Lunge forward, rotate torso over front leg.',10),
      r('Leg swings','Swing each leg forward and back, then side to side.',12),
      r('Short sprints','Accelerate to about 80% over 15 m, walk back.',5)
    ]},
    { id:uid(), name:'Chest day', exercises:[
      r('Bench press','Bar to mid chest, press up, keep shoulder blades pinned.',8),
      r('Incline dumbbell press','Press on a 30° incline for upper chest.',10),
      r('Dumbbell flyes','Wide arc with soft elbows, feel the stretch.',12),
      r('Dips','Lean slightly forward, lower until upper arms are parallel.',10),
      r('Push-ups','Body in one line, chest to just above the floor.',15)
    ]},
    { id:uid(), name:'Back day', exercises:[
      r('Pull-ups','Chin over bar, control the way down.',8),
      r('Barbell rows','Hinge at hips, pull bar to lower ribs.',10),
      r('Lat pulldowns','Pull to upper chest, squeeze lats, no swinging.',12),
      r('Seated cable rows','Pull to stomach, chest up, elbows close.',12),
      r('Face pulls','Pull rope to face height, elbows high.',15)
    ]},
    { id:uid(), name:'Leg day', exercises:[
      r('Squats','Sit between your hips, thighs to parallel or below.',8),
      r('Romanian deadlifts','Hinge with soft knees, feel hamstrings stretch.',10),

/* =========================================================
   Helpers
========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateKey = d => d.toISOString().slice(0,10);
function localKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
const todayKey = () => localKey(new Date());
function fmtSecs(s){
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), r=s%60;
  if(h>0) return `${h}:${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
  return m>0 ? `${m}:${String(r).padStart(2,'0')}` : `${r}s`;
}
function stepMeta(st){
  return st.mode==='time' ? fmtSecs(st.value) : `${st.value} reps`;
}
function titleCase(s){
  return String(s).split(' ').map(w=>w?w[0].toUpperCase()+w.slice(1):w).join(' ');
}
/* number + unit pair for the library stat display */
function doseParts(ex){
  if(ex.mode==='reps') return {num:ex.value, unit:'reps'};
  if(ex.value<60) return {num:ex.value, unit:'sec'};
  if(ex.value<3600){
    const m=Math.floor(ex.value/60), s=ex.value%60;
    return {num: s? `${m}:${String(s).padStart(2,'0')}` : m, unit:'min'};
  }
  return {num:fmtSecs(ex.value), unit:'hrs'};
}
/* inline meta after a title, e.g. "8 Reps" / "45 Secs" / "1:30 Mins" */
function inlineMeta(st){
  const d=doseParts(st);
  const U={reps: st.value===1?'Rep':'Reps', sec:'Secs', min:'Mins', hrs:'Hrs'}[d.unit];
  return `${d.num} ${U}`;
}

/* smoothly swap the contents of the value field: height glides, content fades in */
function swapField(wrap, html){
  const oldH = wrap.offsetHeight;
  wrap.innerHTML = html;
  // measure the new natural height (works for both growing AND shrinking)
  wrap.style.transition='none';
  wrap.style.height='auto';
  const newH = wrap.offsetHeight;
  // start from the old height, then glide to the new one
  wrap.style.height = oldH + 'px';
  wrap.style.overflow = 'hidden';
  wrap.classList.remove('fieldswap');
  void wrap.offsetWidth;
  wrap.classList.add('fieldswap');
  wrap.style.transition = 'height .22s ease';
  requestAnimationFrame(()=>{ wrap.style.height = newH + 'px'; });
  // release the fixed height only once the glide has fully finished,
  // otherwise the content below gets shoved at the end
  let cleaned=false;
  const done=()=>{
    if(cleaned) return; cleaned=true;
    wrap.removeEventListener('transitionend', done);
    wrap.style.height=''; wrap.style.transition=''; wrap.style.overflow='';
  };
  wrap.addEventListener('transitionend', done);
  setTimeout(done, 400); // safety fallback
}

/* looping scroll wheel: values repeat 3x, recentered after each scroll so it wraps forever */
function buildWheel(el, count, initial, start=0){
  const ITEM=40, REP=3;
  const pad2 = start===0; // time wheels show 00, reps show plain numbers
  let rows='';
  for(let r=0;r<REP;r++)
    for(let i=0;i<count;i++){
      const v=start+i;
      rows+=`<div class="it" data-v="${v}">${pad2?String(v).padStart(2,'0'):v}</div>`;
    }
  el.innerHTML=`<div class="pad"></div>${rows}<div class="pad"></div>`;
  const copy=count*ITEM;
  const val=()=>{
    const idx=Math.round(el.scrollTop/ITEM);
    return start + ((idx%count)+count)%count;
  };
  const highlight=()=>{
    const v=val();
    el.querySelectorAll('.it').forEach(n=>n.classList.toggle('on',+n.dataset.v===v));
  };
  el.scrollTop=copy+(initial-start)*ITEM; // start in the middle copy
  highlight();
  let settle=null;
  el.addEventListener('scroll',()=>{
    highlight();
    clearTimeout(settle);
    settle=setTimeout(()=>{
      // jump back to the middle copy at the same value: invisible, makes it loop
      el.scrollTop=copy+(val()-start)*ITEM;
    },140);
  });
  return { get: val };
}

/* =========================================================
   Forms (bottom sheets)
========================================================= */
const Forms = {

  routine(id){
    const r = id ? DB.routines.find(x=>x.id===id) : null;
    Sheet.open(`
      <h2>${r?'Edit Routine':'New Routine'}</h2>
      <div class="field"><label>Name</label>
        <input type="text" id="f-name" value="${r?esc(r.name):''}" placeholder="Morning routine">
      </div>
      <div class="sheet-actions">
        <button class="btn solid" onclick="Forms._saveRoutine('${id||''}')">${r?'Save':'Create'}</button>
        <button class="btn ghost" onclick="Sheet.close()">Cancel</button>
        ${r?`<button class="danger" onclick="Forms._deleteRoutine('${id}')">Delete Routine</button>`:''}
      </div>`);
    setTimeout(()=>$('#f-name').focus(),300);
  },
  _saveRoutine(id){
    const name = $('#f-name').value.trim();
    if(!name) return;
    if(id){ DB.routines.find(x=>x.id===id).name=name; }
    else { const nr={id:uid(),name,steps:[]}; DB.routines.push(nr); state.routineId=nr.id; state.tab='routines'; }
    save(); Sheet.close(); render();
  },
  _deleteRoutine(id){
    sheetConfirm('Delete routine?','This routine and its steps will be deleted.','Delete',()=>{
      DB.routines = DB.routines.filter(x=>x.id!==id);
      DB.habits = DB.habits.filter(h=>h.routineId!==id);
      if(DB.plan) DB.plan.days.forEach(d=>{ if(d.routineId===id) d.routineId=null; });
      state.routineId=null; save(); render();
    });
  },

  step(rid,sid){
    const r = DB.routines.find(x=>x.id===rid);
    const s = sid ? r.steps.find(x=>x.id===sid) : null;
    const mode = s?s.mode:'time';
    Sheet.open(`
      <h2>${s?'Edit Step':'Add Step'}</h2>
      <div class="field"><label>Name</label>
        <input type="text" id="f-name" value="${s?esc(titleCase(s.name)):''}" placeholder="Stretch">
      </div>
      <div class="field"><label>Type</label>
        <div class="seg" id="f-seg">
          <button class="${mode==='time'?'on':''}" data-m="time">Timed</button>
          <button class="${mode==='reps'?'on':''}" data-m="reps">Reps</button>
        </div>
      </div>
      <div class="field" id="f-valwrap"></div>
      <div class="field"><label>Notes (optional)</label>
        <textarea id="f-notes" placeholder="Cues, form tips…">${s?esc(s.notes||''):''}</textarea>
      </div>
      <div class="sheet-actions">
        <button class="btn solid" onclick="Forms._saveStep('${rid}','${sid||''}')">${s?'Save':'Add'}</button>
        <button class="btn ghost" onclick="Sheet.close()">Cancel</button>
        ${s?`<button class="danger" onclick="Forms._deleteStep('${rid}','${sid}')">Delete Step</button>`:''}
      </div>`);
    let m=mode;
    const paint=(first)=>{
      document.querySelectorAll('#f-seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
      let inner;
      if(m==='time'){
        inner = `<label>Duration</label>
          <div class="wheelwrap">
            <div class="wheel" id="wh-hr"></div><span class="wheellbl">h</span>
            <div class="wheel" id="wh-min"></div><span class="wheellbl">m</span>
            <div class="wheel" id="wh-sec"></div><span class="wheellbl">s</span>
            <div class="wheel-center"></div>
          </div>`;
      } else {
        inner = `<label>Reps</label>
          <div class="wheelwrap">
            <div class="wheel" id="wh-reps"></div><span class="wheellbl">reps</span>
            <div class="wheel-center"></div>
          </div>`;
      }
      const wrap=$('#f-valwrap');
      if(first) wrap.innerHTML=inner;
      else swapField(wrap, inner);
      if(m==='time'){
        const v = s&&s.mode==='time' ? s.value : 30;
        Forms._whHr=buildWheel($('#wh-hr'),24,Math.min(Math.floor(v/3600),23));
        Forms._whMin=buildWheel($('#wh-min'),60,Math.floor((v%3600)/60));
        Forms._whSec=buildWheel($('#wh-sec'),60,v%60);
      } else {
        const v = s&&s.mode==='reps' ? s.value : 10;
        Forms._whReps=buildWheel($('#wh-reps'),99,Math.min(Math.max(v,1),99),1);
      }
    };
    paint(true);
    document.querySelectorAll('#f-seg button').forEach(b=>b.onclick=()=>{
      if(b.dataset.m===m) return;
      m=b.dataset.m; paint(false);
    });
    Forms._stepMode=()=>m;
  },
  _saveStep(rid,sid){
    const r = DB.routines.find(x=>x.id===rid);
    const name = $('#f-name').value.trim();
    if(!name) return;
    const m = Forms._stepMode();
    let value;
    if(m==='time'){
      value = (Forms._whHr?Forms._whHr.get():0)*3600 + (Forms._whMin?Forms._whMin.get():0)*60 + (Forms._whSec?Forms._whSec.get():0);
      if(value<=0) value=30;
    } else {
      value = Forms._whReps ? Forms._whReps.get() : 10;
    }
    const notes = $('#f-notes').value.trim();
    if(sid){
      const s=r.steps.find(x=>x.id===sid);
      Object.assign(s,{name,mode:m,value,notes});
    } else {
      r.steps.push({id:uid(),name,mode:m,value,notes});
    }
    save(); Sheet.close(); render();
  },
  _deleteStep(rid,sid){
    const r = DB.routines.find(x=>x.id===rid);
    r.steps = r.steps.filter(x=>x.id!==sid);
    save(); Sheet.close(); render();
  },

  planDay(i){
    const d = DB.plan.days[i];
    const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    let opts = `<option value="">None</option>` + DB.routines.map(r=>
      `<option value="${r.id}" ${d.routineId===r.id?'selected':''}>${esc(titleCase(r.name))}</option>`
    ).join('');
    Sheet.open(`
      <h2>${DAYS[i]}</h2>
      <div class="field"><label>Focus</label>
        <input type="text" id="f-plabel" value="${esc(d.label||'')}" placeholder="Upper Body">
      </div>
      <div class="field"><label>Linked Routine</label>
        <select id="f-proutine">${opts}</select>
      </div>
      <div class="sheet-actions">
        <button class="btn solid" onclick="Forms._savePlanDay(${i})">Save</button>
        <button class="btn ghost" onclick="Sheet.close()">Cancel</button>
      </div>`);
  },
  _savePlanDay(i){
    const d = DB.plan.days[i];
    d.label = $('#f-plabel').value.trim() || 'Rest';
    d.routineId = $('#f-proutine').value || null;
    save(); Sheet.close(); render();
  },

  targets(){
    const t = DB.plan.targets;
    Sheet.open(`
      <h2>Daily Targets</h2>
      <div class="field"><label>Goal</label>
        <input type="text" id="f-tgoal" value="${esc(t.goal)}">
      </div>
      <div class="row2">
        <div class="field"><label>Protein</label>
          <input type="text" id="f-tprotein" value="${esc(t.protein)}">
        </div>
        <div class="field"><label>Sleep</label>
          <input type="text" id="f-tsleep" value="${esc(t.sleep)}">
        </div>
      </div>
      <div class="field"><label>Calories</label>
        <input type="text" id="f-tcal" value="${esc(t.calories)}">
      </div>
      <div class="field"><label>Steps</label>
        <input type="text" id="f-tsteps" value="${esc(t.steps)}">
      </div>
      <div class="sheet-actions">
        <button class="btn solid" onclick="Forms._saveTargets()">Save</button>
        <button class="btn ghost" onclick="Sheet.close()">Cancel</button>
      </div>`);
  },
  _saveTargets(){
    const t = DB.plan.targets;
    t.goal = $('#f-tgoal').value.trim();
    t.protein = $('#f-tprotein').value.trim();
    t.sleep = $('#f-tsleep').value.trim();
    t.calories = $('#f-tcal').value.trim();
    t.steps = $('#f-tsteps').value.trim();
    save(); Sheet.close(); render();
  },

  habit(id){
    const h = id ? DB.habits.find(x=>x.id===id) : null;
    Sheet.open(`
      <h2>${h?'Edit Habit':'New Habit'}</h2>
      <div class="field"><label>Name</label>
        <input type="text" id="f-name" value="${h?esc(h.name):''}" placeholder="Read 20 pages">
      </div>
      <div class="sheet-actions">
        <button class="btn solid" onclick="Forms._saveHabit('${id||''}')">${h?'Save':'Add'}</button>
        <button class="btn ghost" onclick="Sheet.close()">Cancel</button>
        ${h?`<button class="danger" onclick="Forms._deleteHabit('${id}')">Delete Habit</button>`:''}
      </div>`);
    setTimeout(()=>$('#f-name').focus(),300);
  },
  _saveHabit(id){
    const name=$('#f-name').value.trim();
    if(!name) return;
    if(id) DB.habits.find(x=>x.id===id).name=name;
    else DB.habits.push({id:uid(),name,history:{}});
    save(); Sheet.close(); render();
  },
  _deleteHabit(id){
    sheetConfirm('Delete habit?','This habit and its streak history will be deleted.','Delete',()=>{
      DB.habits=DB.habits.filter(x=>x.id!==id);
      save(); render();
    });
  },

  category(id){
    const c = id ? DB.library.find(x=>x.id===id) : null;
    Sheet.open(`
      <h2>${c?'Edit Category':'New Category'}</h2>
      <div class="field"><label>Name</label>
        <input type="text" id="f-name" value="${c?esc(c.name):''}" placeholder="Mobility">
      </div>
      <div class="sheet-actions">
        <button class="btn solid" onclick="Forms._saveCategory('${id||''}')">${c?'Save':'Create'}</button>
        <button class="btn ghost" onclick="Sheet.close()">Cancel</button>
        ${c?`<button class="danger" onclick="Forms._deleteCategory('${id}')">Delete Category and Its Exercises</button>`:''}
      </div>`);
    setTimeout(()=>$('#f-name').focus(),300);
  },
  _saveCategory(id){
    const name=$('#f-name').value.trim();
    if(!name) return;
    if(id) DB.library.find(x=>x.id===id).name=name;
    else DB.library.push({id:uid(),name,exercises:[]});
    save(); Sheet.close(); render();
  },
  _deleteCategory(id){
    sheetConfirm('Delete category?','This category and all exercises in it will be deleted.','Delete',()=>{
      DB.library=DB.library.filter(x=>x.id!==id);
      save(); render();
    });
  },

  exercise(catId,exId){
    const cat = DB.library.find(c=>c.id===catId);
    const ex = exId ? cat.exercises.find(e=>e.id===exId) : null;
    const mode = ex?ex.mode:'reps';
    Sheet.open(`
      <h2>${ex?'Edit Exercise':'New Exercise'}</h2>
      <div class="field"><label>Name</label>
        <input type="text" id="f-name" value="${ex?esc(ex.name):''}" placeholder="Nordic curls">
      </div>
      <div class="field"><label>One line description</label>
        <input type="text" id="f-desc" value="${ex?esc(ex.desc||''):''}" placeholder="What to do, in one line">
      </div>
      <div class="field"><label>Default type</label>
        <div class="seg" id="f-seg">
          <button class="${mode==='time'?'on':''}" data-m="time">Timed</button>
          <button class="${mode==='reps'?'on':''}" data-m="reps">Reps</button>
        </div>
      </div>
      <div class="field" id="f-valwrap"></div>
      <div class="sheet-actions">
        <button class="btn solid" onclick="Forms._saveExercise('${catId}','${exId||''}')">${ex?'Save':'Add'}</button>
        <button class="btn ghost" onclick="Sheet.close()">Cancel</button>
        ${ex?`<button class="danger" onclick="Forms._deleteExercise('${catId}','${exId}')">Delete Exercise</button>`:''}
      </div>`);
    let m=mode;
    const paint=(first)=>{
      document.querySelectorAll('#f-seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
      let inner;
      if(m==='time'){
        const v = ex&&ex.mode==='time'?ex.value:45;
        inner=`<label>Default duration (seconds)</label><input type="number" id="f-val" min="1" value="${v}">`;
      } else {
        const v = ex&&ex.mode==='reps'?ex.value:10;
        inner=`<label>Default reps</label><input type="number" id="f-val" min="1" value="${v}">`;
      }
      const wrap=$('#f-valwrap');
      if(first) wrap.innerHTML=inner;
      else swapField(wrap, inner);
    };
    paint(true);
    document.querySelectorAll('#f-seg button').forEach(b=>b.onclick=()=>{
      if(b.dataset.m===m) return;
      m=b.dataset.m; paint(false);
    });
    Forms._exMode=()=>m;
  },
  _saveExercise(catId,exId){
    const cat=DB.library.find(c=>c.id===catId);
    const name=$('#f-name').value.trim();
    if(!name) return;
    const m=Forms._exMode();
    const value=Math.max(1,parseInt($('#f-val').value)||1);
    const desc=$('#f-desc').value.trim();
    if(exId){
      Object.assign(cat.exercises.find(e=>e.id===exId),{name,desc,mode:m,value});
    } else {
      cat.exercises.push({id:uid(),name,desc,mode:m,value});
    }
    save(); Sheet.close(); render();
  },
  _deleteExercise(catId,exId){
    const cat=DB.library.find(c=>c.id===catId);
    cat.exercises=cat.exercises.filter(e=>e.id!==exId);
    save(); Sheet.close(); render();
  }
};

        <svg class="ring" viewBox="0 0 100 100">
          <circle class="track" cx="50" cy="50" r="${this.RADIUS}"/>
          <circle class="prog" id="r-prog" cx="50" cy="50" r="${this.RADIUS}"
            stroke-dasharray="${C}" stroke-dashoffset="0"/>
        </svg>
        <div class="inner">${inner}</div>
      </div>`;

    if(s.mode==='time'){
      this.remaining=s.value;
      $('#r-mid').innerHTML=`
        <div class="r-spacer"></div>
        <div class="r-step">${esc(titleCase(s.name))}</div>
        ${ring(`<div class="r-time" id="r-time">${fmtSecs(this.remaining)}</div>`)}
        ${s.notes?`<div class="r-notes">${esc(s.notes)}</div>`:''}
        <div class="r-nextwrap">${nextLine}</div>`;
      $('#r-ctrl').innerHTML=`
        <button class="small" id="r-pp" onclick="Runner.toggle()">${ICONS.pause}</button>
        <button class="big" onclick="Runner.complete()">${ICONS.check}</button>
        <button class="small" onclick="Runner.skip()">${ICONS.next}</button>`;
      this.paused=false;
      this.setRing(0);
      this.barSmooth(s.value);
      this.tickStart();
    } else {
      this.repsDone=0;
      $('#r-mid').innerHTML=`
        <div class="r-spacer"></div>
        <div class="r-step">${esc(titleCase(s.name))}</div>
        ${ring(`<div class="r-reps"><span class="num">${s.value}</span><span class="lbl">reps</span></div>`)}
        ${s.notes?`<div class="r-notes">${esc(s.notes)}</div>`:''}
        <div class="r-nextwrap">${nextLine}</div>`;
      $('#r-ctrl').innerHTML=`
        <button class="small" onclick="Runner.addRep()">${ICONS.plus}</button>
        <button class="big" onclick="Runner.complete()">${ICONS.check}</button>
        <button class="small" onclick="Runner.skip()">${ICONS.next}</button>`;
      this.setRing(0);
      this.barReset();
    }
    // short slide-in for each new step
    const mid=$('#r-mid');
    mid.classList.remove('stepin');
    void mid.offsetWidth;
    mid.classList.add('stepin');
  },

  setRing(frac){
    const el=$('#r-prog');
    if(el) el.style.strokeDashoffset = this.CIRC*frac; // frac 0 = full ring, drains as time passes
  },

  tickStart(){
    const s=this.r.steps[this.idx];
    this.timer=setInterval(()=>{
      if(this.paused) return;
      const el=$('#r-time');
      if(this.overtimeActive){
        this.overtime++;
        if(el) el.textContent='+'+fmtSecs(this.overtime);
        return;
      }
      this.remaining--;
      if(this.remaining<=0){
        // time's up: hold here and count overtime until the user taps the check
        this.overtimeActive=true; this.overtime=0;
        if(el){ el.textContent='+'+fmtSecs(0); el.classList.add('over'); }
        this.setRing(1);
        return;
      }
      if(el) el.textContent=fmtSecs(this.remaining);
      this.setRing((s.value-this.remaining)/s.value);
    },1000);
  },

  barEl(){ return $('#r-bar'); },
  barReset(){
    const b=this.barEl();
    b.style.transition='none'; b.style.width='0%';
  },
  // timed steps: one continuous linear animation across the whole duration
  barSmooth(secs){
    const b=this.barEl();
    b.style.transition='none'; b.style.width='0%';
    void b.offsetWidth; // force reflow so the transition restarts cleanly
    b.style.transition=`width ${secs}s linear`;
    b.style.width='100%';
  },
  barFreeze(){
    const b=this.barEl();
    const w=getComputedStyle(b).width; // capture exact current position
    b.style.transition='none'; b.style.width=w;
  },
  barResume(){
    const b=this.barEl();
    void b.offsetWidth;
    b.style.transition=`width ${this.remaining}s linear`;
    b.style.width='100%';
  },
  // rep steps: quick eased jump per tap
  paintBar(stepFrac){
    const b=this.barEl();
    b.style.transition='width .25s ease';
    b.style.width=(Math.min(stepFrac,1)*100)+'%';
  },

  toggle(){
    this.paused=!this.paused;
    const b=$('#r-pp'); if(b) b.innerHTML=this.paused?ICONS.play:ICONS.pause;
    const s=this.r.steps[this.idx];
    if(s.mode==='time' && !this.overtimeActive){
      this.paused ? this.barFreeze() : this.barResume();
    }
  },

  // rep steps: each + tap fills a slice of the bottom bar (never the circle)
  addRep(){
    const s=this.r.steps[this.idx];
    if(s.mode!=='reps') return;
    this.repsDone=(this.repsDone||0)+1;
    if(this.repsDone>=s.value){ this.complete(); return; }
    this.paintBar(this.repsDone/s.value);
  },

  // check button: advance to the next step (sound only plays at routine finish)
  complete(){
    this.advance();
  },
  // skip: advance silently
  skip(){ this.advance(); },

  advance(){
    if(this.idx>=this.r.steps.length-1) return this.finish();
    this.idx++; this.loadStep();
  },

  finish(){
    clearInterval(this.timer);
    $('#r-count').textContent='';
    const b=this.barEl();
    b.style.transition='none'; b.style.width='100%';
    // if this routine is tracked as a habit, mark today complete
    const linked = DB.habits.find(h=>h.routineId===this.r.id);
    let habitLine='';
    if(linked){
      if(!linked.history[todayKey()]){ linked.history[todayKey()]=true; save(); }
      habitLine=`<div class="r-notes">Habit marked done · ${streak(linked)}·day streak</div>`;
    }
    $('#r-mid').innerHTML=`
      <div class="r-spacer"></div>
      <div class="r-step" style="font-size:34px">Done.</div>
      <div class="r-notes">${esc(titleCase(this.r.name))} complete</div>
      ${habitLine}
      <button class="r-done-btn" onclick="Runner.exit()">Finish</button>
      <div class="r-spacer"></div>`;
    $('#r-ctrl').innerHTML='';
    const mid=$('#r-mid');
    mid.classList.remove('stepin');
    void mid.offsetWidth;
    mid.classList.add('stepin');
    this.playDing();
  },

  exit(){
    clearInterval(this.timer);
    $('#runner').classList.remove('open');
    if(this.wakeLock){ try{this.wakeLock.release();}catch(e){} this.wakeLock=null; }
  },

  async requestWake(){
    try{ if('wakeLock' in navigator) this.wakeLock=await navigator.wakeLock.request('screen'); }catch(e){}
  },

  // custom completion sound (embedded audio file)
  _actx:null, _buf:null, _audio:null,
  unlockAudio(){
    try{
      // Web Audio: create/resume context on the user's tap (this is what iOS requires)
      if(!this._actx) this._actx=new (window.AudioContext||window.webkitAudioContext)();
      if(this._actx.state==='suspended') this._actx.resume();
      // decode the embedded sound once
      if(!this._buf){
        fetch(DING_SOUND)
          .then(r=>r.arrayBuffer())
          .then(ab=>new Promise((res,rej)=>this._actx.decodeAudioData(ab,res,rej)))
          .then(b=>{ this._buf=b; })
          .catch(()=>{});
      }
      // HTMLAudio fallback, warmed on the same gesture
      if(!this._audio){ this._audio=new Audio(DING_SOUND); this._audio.preload='auto'; }
      const a=this._audio;
      a.muted=true;
      a.play().then(()=>{ a.pause(); a.currentTime=0; a.muted=false; }).catch(()=>{ a.muted=false; });
    }catch(e){}
  },
  playDing(){
    try{
      if(this._actx && this._buf){
        if(this._actx.state==='suspended') this._actx.resume();
        const src=this._actx.createBufferSource();
        src.buffer=this._buf;
        src.connect(this._actx.destination);
        src.start();
        return;
      }
      if(this._audio){ this._audio.currentTime=0; this._audio.muted=false; this._audio.play().catch(()=>{}); }
    }catch(e){}
  }
};

render();
</script>
</body>
</html>
